name: Perf Nightly

env:
  NODE_VERSION: 20.11.1
  PNPM_VERSION: 9.15.4

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  perf-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable corepack and activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
      - name: Prune pnpm store
        run: pnpm store prune
      - name: Install
        run: pnpm install --frozen-lockfile --filter @mesh/conformance-tests...
      - name: Verify lockfile is clean after install
        run: pnpm check:lockfile-clean
      - name: Build
        run: pnpm -r --filter @mesh/conformance-tests... build
      - name: Run nightly perf budgets
        run: pnpm bench:nightly --fail-on-regression
      - name: Upload nightly perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-nightly-artifacts
          path: |
            artifacts/perf-nightly/nightly-perf-results.json
            artifacts/perf-nightly/nightly-perf-summary.md
          if-no-files-found: warn
