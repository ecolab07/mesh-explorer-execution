name: Perf Nightly

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

jobs:
  perf-nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Verify lockfile is clean after install
        run: pnpm check:lockfile-clean
      - name: Build
        run: pnpm -r build
      - name: Run nightly perf budgets
        run: pnpm bench:nightly --fail-on-regression
      - name: Upload nightly perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-nightly-artifacts
          path: |
            artifacts/perf-nightly/nightly-perf-results.json
            artifacts/perf-nightly/nightly-perf-summary.md
          if-no-files-found: warn
