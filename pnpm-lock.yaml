lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      typescript:
        specifier: ^5.6.3
        version: 5.6.3
      vitest:
        specifier: ^2.1.8
        version: 2.1.8

  packages/conformance-harness:
    dependencies:
      '@mesh/eventstore-local':
        specifier: workspace:*
        version: link:../eventstore-local
      '@mesh/shared':
        specifier: workspace:*
        version: link:../shared

  packages/conformance-tests:
    dependencies:
      '@mesh/conformance-harness':
        specifier: workspace:*
        version: link:../conformance-harness
      '@mesh/shared':
        specifier: workspace:*
        version: link:../shared

  packages/eventstore-local:
    dependencies:
      '@mesh/shared':
        specifier: workspace:*
        version: link:../shared

  packages/kernel-minimal:
    dependencies:
      '@mesh/eventstore-local':
        specifier: workspace:*
        version: link:../eventstore-local
      '@mesh/shared':
        specifier: workspace:*
        version: link:../shared

  packages/shared: {}

packages:

  typescript@5.6.3:
    resolution: {}

  vitest@2.1.8:
    resolution: {}

snapshots:

  typescript@5.6.3: {}

  vitest@2.1.8: {}
